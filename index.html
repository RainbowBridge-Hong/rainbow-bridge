<body>
<div id="login">
  <div class="lg">&#x1F308;</div>

  <div class="sub">连接你与世界的每一刻</div>

    <div class="tabs">
      <button class="tab on" id="tab-login" onclick="app.switchTab('login')">登录</button>

    </div>

    </div>
    <div id="form-reg" class="form-body">
      <div class="ig"><input id="re-name" placeholder="输入姓名" autocomplete="off"></div>
      <div class="ig"><input id="re-pw" type="password" placeholder="设置密码"></div>
      <div class="ig"><input id="re-dept" placeholder="所属部门" autocomplete="off"></div>
      <button class="bt" onclick="app.doReg()">创建账号</button>
    </div>
  </div>
  <div class="tip">演示：任意姓名 + 密码123456</div>
</div>

  <div id="gallery-screen" class="screen">
    <div class="hdr"><div class="hb" onclick="app.backHome()">&#x2190;</div><div class="ht">相册</div></div>
    <div class="body"><div class="gg" id="gallery-grid"></div></div>
  </div>

  <!-- ORG -->
  <div id="org-screen" class="screen">
    <div class="hdr"><div class="hb" onclick="app.backHome()">&#x2190;</div><div class="ht">组织架构</div></div>
    <div class="body"><div class="ot" id="org-tree"></div></div>
  </div>

  <!-- CONTACTS -->
  <div id="contacts-screen" class="screen">
    <div class="hdr"><div class="hb" onclick="app.backHome()">&#x2190;</div><div class="ht">通讯录</div></div>
    <div class="body"><div class="cl2" id="contacts-list"></div></div>
  </div>

  <!-- NOTIFICATIONS -->
  <div id="notif-screen" class="screen">
    <div class="hdr"><div class="hb" onclick="app.backHome()">&#x2190;</div><div class="ht">通知</div></div>
    <div class="body"><div class="nl" id="notif-list"></div></div>
  </div>

  <!-- CHAT DETAIL -->
  <div id="chat-detail-screen" class="screen">
    <div class="hdr"><div class="hb" onclick="app.backHome()">&#x2190;</div><div class="ht" id="chat-title">聊天</div></div>
    <div class="cmsgs" id="chat-msgs"></div>
    <div class="cinput"><input id="chat-input" placeholder="输入消息..."><button class="csend" id="send-btn">&#x25B6;</button></div>
  </div>

  <!-- PROFILE -->
  <div id="profile-screen" class="screen">
    <div class="hdr"><div class="hb" onclick="app.backHome()">&#x2190;</div><div class="ht">我的</div></div>
    <div class="body">
      <div class="phd">
        <div class="pif">
          <div class="pav">&#x1F464;</div>
          <div>
            <div class="pn" id="profile-name">陈默</div>
            <div class="pde" id="profile-dept">产品运营部</div>
            <div class="prol" id="profile-role">产品经理</div>
          </div>
        </div>
        <div class="pst">
          <div class="ps"><div class="psv" id="ps-total">0</div><div class="psl">总任务</div></div>
          <div class="ps"><div class="psv" id="ps-done">0</div><div class="psl">已完成</div></div>
          <div class="ps"><div class="psv" id="ps-msg">0</div><div class="psl">未读消息</div></div>
        </div>
      </div>
      <div class="pb">
        <div class="pmenu">
          <div class="mi2menu" onclick="app.show('tasks')"><div class="mi2ic" style="background:#e3f2fd">&#x1F4CB;</div><div class="mi2lb">我的任务</div><span class="mi2ar">&#x203A;</span></div>
          <div class="mi2menu" onclick="app.show('accounts')"><div class="mi2ic" style="background:#e8f5e9">&#x1F4B0;</div><div class="mi2lb">我的账本</div><span class="mi2ar">&#x203A;</span></div>
          <div class="mi2menu" onclick="logout()"><div class="mi2ic" style="background:#fce4ec">&#x23FB;</div><div class="mi2lb" style="color:#ff6b6b">退出登录</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB BAR -->
  <div class="tabbar">
    <button class="ti on" id="tab-0" onclick="app.switchTabBar(0)"><span class="ti-ic">&#x1F3E0;</span><span class="ti-lb">首页</span></button>
    <button class="ti" id="tab-1" onclick="app.switchTabBar(1)"><span class="ti-ic">&#x1F4AC;</span><span class="ti-lb">消息</span><span class="ti-dot" id="tab-dot" style="display:none"></span></button>
    <button class="ti" id="tab-2" onclick="app.switchTabBar(2)"><span class="ti-ic">&#x1F4BC;</span><span class="ti-lb">工作台</span></button>
    <button class="ti" id="tab-3" onclick="app.switchTabBar(3)"><span class="ti-ic">&#x1F465;</span><span class="ti-lb">通讯录</span></button>
    <button class="ti" id="tab-4" onclick="app.switchTabBar(4)"><span class="ti-ic">&#x1F464;</span><span class="ti-lb">我的</span></button>
  </div>

</div>
<script src="js/app.js"></script>
</body>
</html>
