<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#667eea">
<title>彩虹桥</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#667eea;--secondary:#764ba2;--danger:#ff4757;--success:#2ed573;--bg:#f5f6fa;--text:#2f3542;--border:#dfe4ea}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
/* Login */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:1000}
#login.hide{display:none}
.logo{font-size:72px;margin-bottom:16px}
.title{font-size:36px;font-weight:700;color:#fff;margin-bottom:4px}
.subtitle{font-size:14px;color:rgba(255,255,255,.8);margin-bottom:32px}
.form{width:100%;max-width:340px}
.tabs{display:flex;background:rgba(255,255,255,.25);border-radius:30px;padding:5px;margin-bottom:20px}
.tab{flex:1;padding:12px;border:none;background:transparent;color:rgba(255,255,255,.85);font-size:15px;font-weight:500;cursor:pointer;border-radius:25px;transition:all .3s}
.tab.active{background:#fff;color:var(--primary);box-shadow:0 4px 15px rgba(0,0,0,.15)}
.form-panel{display:none}
.form-panel.active{display:block}
.input{width:100%;padding:16px 18px;border:none;border-radius:14px;font-size:15px;margin-bottom:14px;background:rgba(255,255,255,.95);outline:none;transition:all .3s}
.input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;background:#fff;color:var(--primary);box-shadow:0 6px 20px rgba(0,0,0,.15);transition:all .3s}
.btn:active{transform:scale(.97)}
/* App */
#app{display:none;height:100vh;flex-direction:column}
#app.show{display:flex}
/* Header */
.header{height:58px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;padding:0 12px;box-shadow:0 2px 10px rgba(102,126,234,.3);color:#fff}
.back{width:42px;height:42px;border:none;background:rgba(255,255,255,.2);border-radius:50%;color:#fff;font-size:20px;cursor:pointer}
.header-title{flex:1;font-size:18px;font-weight:600;text-align:center}
.header-btn{width:42px;height:42px;border:none;background:rgba(255,255,255,.2);border-radius:50%;color:#fff;font-size:20px;cursor:pointer;margin-left:8px;position:relative}
.header-btn .badge{position:absolute;top:-2px;right:-2px;width:18px;height:18px;background:var(--danger);border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;display:none}
/* Main */
.main{flex:1;display:flex;overflow:hidden}
/* Sidebar */
.sidebar{width:100%;max-width:320px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;gap:8px}
.sidebar-btn{flex:1;padding:12px;border:none;background:var(--primary);color:#fff;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer}
.sidebar-search{padding:12px 16px;border-bottom:1px solid var(--border)}
.sidebar-search input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none}
.sidebar-search input:focus{border-color:var(--primary)}
.chat-list{flex:1;overflow-y:auto}
.chat-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:all .2s;position:relative}
.chat-item:hover{background:#f8f9fa}
.chat-item.active{background:#f0f2ff}
.chat-header{display:flex;align-items:center;gap:10px}
.chat-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex-shrink:0}
.chat-info{flex:1;min-width:0}
.chat-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-preview{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.chat-meta{text-align:right;flex-shrink:0}
.chat-time{font-size:11px;color:#aaa}
.chat-badge{display:inline-block;background:var(--danger);color:#fff;font-size:11px;padding:3px 8px;border-radius:20px;margin-top:4px}
/* Chat Area */
.chat-area{flex:1;display:flex;flex-direction:column;background:#fff}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa}
.chat-empty-icon{font-size:64px;margin-bottom:16px}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:10px;max-width:85%;animation:slideIn .3s ease}
.msg.mine{flex-direction:row-reverse;margin-left:auto}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0;cursor:pointer}
.msg-bubble{max-width:100%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word}
.msg.mine .msg-bubble{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-bottom-right-radius:4px}
.msg:not(.mine) .msg-bubble{background:#f1f2f6;color:var(--text);border-bottom-left-radius:4px}
.msg-img{max-width:220px;border-radius:12px;cursor:pointer;display:block}
.msg-time{font-size:10px;color:#aaa;margin-top:4px;text-align:center}
/* Input */
.input-area{padding:12px 16px;background:#fff;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}
.msg-input{flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:24px;font-size:14px;outline:none;resize:none;max-height:100px;font-family:inherit}
.msg-input:focus{border-color:var(--primary)}
.icon-btn{width:44px;height:44px;border:none;background:#f1f2f6;color:var(--primary);font-size:22px;cursor:pointer;border-radius:50%;transition:all .2s}
.icon-btn:active{background:var(--primary);color:#fff;transform:scale(.9)}
.send-btn{width:48px;height:48px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:20px;cursor:pointer;border-radius:50%;box-shadow:0 4px 15px rgba(102,126,234,.4)}
.send-btn:active{transform:scale(.9)}
/* Emoji Picker */
.emoji-picker{display:none;position:absolute;bottom:70px;left:16px;right:16px;background:#fff;border-radius:16px;box-shadow:0 -4px 20px rgba(0,0,0,.15);padding:16px;z-index:100}
.emoji-picker.show{display:block}
.emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.emoji-btn{width:40px;height:40px;border:none;background:#f8f9fa;border-radius:10px;font-size:22px;cursor:pointer;transition:all .2s}
.emoji-btn:hover{background:var(--primary);transform:scale(1.1)}
/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:20px;padding:24px;max-width:380px;width:90%;max-height:80vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-input{width:100%;padding:14px;border:1px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:12px;outline:none}
.modal-input:focus{border-color:var(--primary)}
.modal-textarea{width:100%;padding:14px;border:1px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:12px;outline:none;resize:none;height:80px;font-family:inherit}
.modal-buttons{display:flex;gap:10px;margin-top:16px}
.modal-btn{flex:1;padding:14px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.modal-btn.primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.modal-btn.secondary{background:#f1f2f6;color:var(--text)}
/* Members List */
.member-list{max-height:300px;overflow-y:auto}
.member-item{display:flex;align-items:center;padding:12px;border-bottom:1px solid var(--border);cursor:pointer;transition:all .2s}
.member-item:hover{background:#f8f9fa}
.member-item.selected{background:#f0f2ff}
.member-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;margin-right:12px;font-size:20px}
.member-info{flex:1}
.member-name{font-size:14px;font-weight:600}
.member-status{font-size:12px;color:#888;margin-top:2px}
.member-check{width:24px;height:24px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;transition:all .2s}
.member-item.selected .member-check{background:var(--primary);border-color:var(--primary)}
/* Typing indicator */
.typing{font-size:12px;color:#888;padding:8px 16px;display:none}
.typing.show{display:block}
/* Online indicator */
.online-dot{width:10px;height:10px;background:var(--success);border-radius:50%;border:2px solid #fff;position:absolute;bottom:2px;right:2px}
/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:#aaa}
.empty-icon{font-size:48px;margin-bottom:12px}
/* Profile modal */
.profile-header{text-align:center;padding:20px 0}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;margin:0 auto 12px}
.profile-name{font-size:20px;font-weight:700}
.profile-info{font-size:13px;color:#888;margin-top:4px}
/* Settings */
.settings-item{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer}
.settings-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-right:12px}
.settings-label{flex:1;font-size:14px}
.settings-arrow{color:#ccc}
/* Responsive */
@media(max-width:768px){
  .sidebar{max-width:100%;width:100%}
  .msg{max-width:90%}
}
</style>
</head>
<body>
<!-- Login -->
<div id="login">
  <div class="logo">🌈</div>
  <div class="title">彩虹桥</div>
  <div class="subtitle">彩虹桥，靠近一点让我看看你！</div>
  <div class="form">
    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="app.switchTab('login')">登录</button>
      <button class="tab" id="registerTab" onclick="app.switchTab('register')">注册</button>
    </div>
    <div id="loginPanel" class="form-panel active">
      <input class="input" id="loginUser" placeholder="输入用户名或手机号">
      <input class="input" id="loginPwd" type="password" placeholder="输入密码">
      <button class="btn" onclick="app.login()">登 录</button>
    </div>
    <div id="registerPanel" class="form-panel">
      <input class="input" id="regUser" placeholder="设置用户名（2-20个字符）">
      <input class="input" id="regPhone" placeholder="输入手机号">
      <input class="input" id="regPwd" type="password" placeholder="设置密码（6位以上）">
      <button class="btn" onclick="app.register()">注 册</button>
    </div>
  </div>
</div>

<!-- App -->
<div id="app">
  <!-- Header -->
  <div class="header">
    <button class="back" onclick="app.goBack()" id="backBtn" style="display:none">←</button>
    <div class="header-title" id="headerTitle">彩虹桥</div>
    <button class="header-btn" onclick="app.showNotifications()">🔔<span class="badge" id="notifBadge">0</span></button>
    <button class="header-btn" onclick="app.showSettings()">⚙️</button>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="sidebar-btn" onclick="app.showNewChat()">💬 新聊天</button>
        <button class="sidebar-btn" onclick="app.showNewGroup()">👥 建群组</button>
      </div>
      <div class="sidebar-search">
        <input id="searchInput" placeholder="搜索聊天..." oninput="app.searchChats()">
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
      <div class="chat-empty" id="chatEmpty">
        <div class="chat-empty-icon">💬</div>
        <div>选择一个聊天开始</div>
        <div style="font-size:13px;margin-top:8px">或点击"新聊天"开始新对话</div>
      </div>
      <div class="messages" id="messages" style="display:none"></div>
      <div class="typing" id="typingIndicator">对方正在输入...</div>
      <div class="input-area" id="inputArea" style="display:none">
        <button class="icon-btn" onclick="app.toggleEmoji()">😊</button>
        <input class="msg-input" id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();app.sendMsg()}">
        <button class="icon-btn" onclick="app.showImageUpload()">🖼️</button>
        <button class="send-btn" onclick="app.sendMsg()">➤</button>
      </div>
      <div class="emoji-picker" id="emojiPicker">
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>
    </div>
  </div>
</div>

<!-- New Chat Modal -->
<div id="newChatModal" class="modal">
  <div class="modal-content">
    <div class="modal-title">选择联系人聊天</div>
    <div class="member-list" id="userList"></div>
    <div class="modal-buttons">
      <button class="modal-btn secondary" onclick="app.closeModal('newChatModal')">取消</button>
    </div>
  </div>
</div>

<!-- New Group Modal -->
<div id="newGroupModal" class="modal">
  <div class="modal-content">
    <div class="modal-title">创建群组</div>
    <input class="modal-input" id="groupName" placeholder="群组名称">
    <div style="font-size:13px;color:#888;margin-bottom:8px">选择成员（可多选）：</div>
    <div class="member-list" id="groupMemberList"></div>
    <div class="modal-buttons">
      <button class="modal-btn secondary" onclick="app.closeModal('newGroupModal')">取消</button>
      <button class="modal-btn primary" onclick="app.createGroup()">创建群组</button>
    </div>
  </div>
</div>

<!-- Image Modal -->
<div id="imageModal" class="modal">
  <div class="modal-content">
    <div class="modal-title">发送图片</div>
    <input class="modal-input" id="imageUrl" placeholder="粘贴图片网址 URL">
    <div style="font-size:12px;color:#888;margin-bottom:12px">提示：在网上找到图片，右键复制图片地址，然后粘贴到这里</div>
    <div class="modal-buttons">
      <button class="modal-btn secondary" onclick="app.closeModal('imageModal')">取消</button>
      <button class="modal-btn primary" onclick="app.sendImage()">发送</button>
    </div>
  </div>
</div>

<!-- Profile Modal -->
<div id="profileModal" class="modal">
  <div class="modal-content">
    <div class="modal-title">个人信息</div>
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar">👤</div>
      <div class="profile-name" id="profileName"></div>
      <div class="profile-info" id="profileInfo"></div>
    </div>
    <div class="settings-item" onclick="app.showMyProfile()">
      <div class="settings-icon" style="background:#e3f2fd">👤</div>
      <div class="settings-label">编辑个人资料</div>
      <div class="settings-arrow">›</div>
    </div>
    <div class="modal-buttons" style="margin-top:20px">
      <button class="modal-btn secondary" onclick="app.closeModal('profileModal')">关闭</button>
    </div>
  </div>
</div>

<!-- Notifications Modal -->
<div id="notifModal" class="modal">
  <div class="modal-content">
    <div class="modal-title">通知中心</div>
    <div id="notifList" style="max-height:400px;overflow-y:auto"></div>
    <div class="modal-buttons" style="margin-top:16px">
      <button class="modal-btn secondary" onclick="app.closeModal('notifModal')">关闭</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal">
  <div class="modal-content">
    <div class="modal-title">设置</div>
    <div class="settings-item" onclick="app.showProfile()">
      <div class="settings-icon" style="background:#e3f2fd">👤</div>
      <div class="settings-label">个人资料</div>
      <div class="settings-arrow">›</div>
    </div>
    <div class="settings-item">
      <div class="settings-icon" style="background:#e8f5e9">🔔</div>
      <div class="settings-label">通知设置</div>
      <div class="settings-arrow">›</div>
    </div>
    <div class="settings-item">
      <div class="settings-icon" style="background:#fff3e0">🔒</div>
      <div class="settings-label">隐私设置</div>
      <div class="settings-arrow">›</div>
    </div>
    <div class="settings-item">
      <div class="settings-icon" style="background:#fce4ec">📱</div>
      <div class="settings-label">关于彩虹桥</div>
      <div class="settings-arrow">›</div>
    </div>
    <div class="modal-buttons" style="margin-top:20px">
      <button class="modal-btn secondary" onclick="app.logout()">退出登录</button>
    </div>
  </div>
</div>

<!-- Image Preview Modal -->
<div id="previewModal" class="modal" onclick="app.closeModal('previewModal')">
  <div class="modal-content" style="background:transparent;padding:0;max-width:95vw">
    <img id="previewImage" style="max-width:100%;max-height:80vh;border-radius:12px" onclick="event.stopPropagation()">
    <div class="modal-buttons" style="margin-top:16px">
      <button class="modal-btn secondary" onclick="app.closeModal('previewModal')">关闭</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
